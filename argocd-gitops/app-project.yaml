apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-engineering
  namespace: argocd
spec:
  description: "Platform Engineering IDP managed applications"
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
