apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-apps
  namespace: argocd
spec:
  project: platform-engineering
  source:
    repoURL: 'https://github.com/your-username/internal-developer-platform-poc.git'
    targetRevision: HEAD
    path: argocd-gitops/platform-apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
