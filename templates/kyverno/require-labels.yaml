apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Requires all pods to have the 'app.kubernetes.io/name' and 'owner' labels.
      This is crucial for FinOps cost attribution and general platform hygiene.
spec:
  validationFailureAction: enforce
  rules:
  - name: check-for-labels
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "The labels 'app.kubernetes.io/name' and 'owner' are required."
      pattern:
        metadata:
          labels:
            app.kubernetes.io/name: "?*"
            owner: "?*"
